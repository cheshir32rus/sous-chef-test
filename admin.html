<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Админка — Тест на су-шефа</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0a0a0a; --surface: #131313; --surface-2: #1b1b1b;
  --border: #262626; --border-strong: #3a3a3a;
  --text: #ececec; --text-dim: #7a7a7a;
  --gold: #c9a227; --gold-bright: #e0b830; --gold-tint: rgba(201,162,39,0.10);
  --success: #4caf50; --warning: #f39c12; --danger: #e74c3c;
  --font-head: 'Oswald', 'Arial Narrow', sans-serif;
  --font-body: 'Inter', system-ui, sans-serif;
}
body {
  background: var(--bg); color: var(--text); font-family: var(--font-body);
  min-height: 100vh; padding: 24px 16px;
  background-image: radial-gradient(ellipse 800px 400px at 50% 0%, rgba(201,162,39,0.06), transparent 70%);
}
.container { max-width: 960px; margin: 0 auto; }
.hidden { display: none !important; }
.badge {
  display: inline-block; font-family: var(--font-head); font-size: 11px;
  letter-spacing: 0.25em; text-transform: uppercase; color: var(--gold);
  border: 1px solid var(--gold); padding: 4px 10px; border-radius: 2px; margin-bottom: 20px;
}
h1 { font-family: var(--font-head); font-size: 30px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 24px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 24px; margin-bottom: 16px; }
.panel { max-width: 420px; margin: 80px auto; }
.input { width: 100%; background: var(--surface-2); border: 1px solid var(--border-strong); color: var(--text); font-size: 16px; padding: 14px 16px; border-radius: 3px; outline: none; }
.input:focus { border-color: var(--gold); }
.btn { font-family: var(--font-head); font-size: 14px; letter-spacing: 0.15em; text-transform: uppercase; padding: 14px 24px; border-radius: 3px; cursor: pointer; border: 1px solid var(--gold); background: var(--gold); color: #0a0a0a; font-weight: 600; }
.btn:hover { background: var(--gold-bright); border-color: var(--gold-bright); }
.btn-ghost { background: transparent; color: var(--text-dim); border-color: var(--border-strong); }
.btn-ghost:hover { color: var(--text); border-color: var(--text-dim); }
.btn-danger { background: transparent; color: var(--danger); border-color: var(--danger); }
.btn-danger:hover { background: var(--danger); color: #fff; }
.topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 12px; }
.topbar h1 { margin: 0; }
.result-row {
  display: grid; grid-template-columns: 1fr auto auto; gap: 16px; align-items: center;
  padding: 14px 18px; background: var(--surface-2); border: 1px solid var(--border-strong);
  border-radius: 3px; margin-bottom: 8px; cursor: pointer; transition: all 0.12s;
}
.result-row:hover { border-color: var(--gold); background: var(--gold-tint); }
.result-name { font-weight: 600; font-size: 15px; }
.result-meta { font-size: 12px; color: var(--text-dim); margin-top: 2px; letter-spacing: 0.05em; }
.result-score { font-family: var(--font-head); font-size: 24px; font-weight: 600; }
.result-score.green { color: var(--success); }
.result-score.yellow { color: var(--warning); }
.result-score.red { color: var(--danger); }
.detail-header { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
.detail-meta { font-size: 13px; color: var(--text-dim); line-height: 1.6; }
.qa { padding: 16px 0; border-bottom: 1px solid var(--border); }
.qa:last-child { border-bottom: none; }
.qa-q { font-weight: 500; margin-bottom: 10px; line-height: 1.4; }
.qa-score { font-family: var(--font-head); color: var(--gold); font-size: 13px; letter-spacing: 0.1em; float: right; }
.qa-label { font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-dim); margin: 8px 0 4px; }
.qa-item { font-size: 14px; padding: 4px 0; }
.qa-item.ok { color: var(--success); }
.qa-item.miss { color: var(--danger); }
.qa-item.neutral { color: var(--text-dim); }
.empty { text-align: center; color: var(--text-dim); padding: 40px 0; }

@media print {
  body { background: #fff !important; color: #000 !important; padding: 0; }
  .container { max-width: 100%; }
  .card { background: #fff !important; border: none !important; padding: 0; box-shadow: none; }
  .topbar, .btn, .badge { display: none !important; }
  h1 { color: #000 !important; margin-bottom: 10px; }
  .detail-header { border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 20px; }
  .detail-meta { color: #333 !important; }
  .qa { border-bottom: 1px solid #ccc !important; page-break-inside: avoid; }
  .qa-q { color: #000 !important; }
  .qa-score { color: #000 !important; font-weight: bold; }
  .qa-label { color: #555 !important; }
  .qa-item.ok { color: #000 !important; font-weight: bold; }
  .qa-item.ok::before { content: "[+] "; }
  .qa-item.miss { color: #000 !important; text-decoration: line-through; }
  .qa-item.miss::before { content: "[-] "; text-decoration: none; }
  .qa-item.neutral { color: #333 !important; }
  .qa-item.neutral::before { content: "[ ] "; }
}
</style>
</head>
<body>
<div class="container">

  <div id="screen-login" class="card panel">
    <div class="badge">Админка</div>
    <h1>Вход</h1>
    <label style="display:block;font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--text-dim);margin-bottom:8px;">Пароль</label>
    <input type="password" id="pwd" class="input" placeholder="Пароль" autocomplete="off">
    <button id="btn-login" class="btn" style="width:100%;margin-top:16px;">Войти</button>
    <p id="login-error" class="hidden" style="color:var(--danger);font-size:13px;margin-top:12px;text-align:center;">Неверный пароль</p>
  </div>

  <div id="screen-list" class="hidden">
    <div class="topbar">
      <h1>Результаты</h1>
      <div>
        <button id="btn-refresh" class="btn btn-ghost" style="padding:10px 16px;font-size:12px;">Обновить</button>
        <button id="btn-logout" class="btn btn-ghost" style="padding:10px 16px;font-size:12px;">Выйти</button>
      </div>
    </div>
    <div id="results-container"><div class="empty">Загрузка…</div></div>
  </div>

  <div id="screen-detail" class="hidden">
    <div class="topbar">
      <button id="btn-back" class="btn btn-ghost" style="padding:10px 16px;font-size:12px;">← Назад</button>
      <div style="display:flex; gap:12px;">
        <button id="btn-delete" class="btn btn-danger" style="padding:10px 16px;font-size:12px;">Удалить</button>
        <button id="btn-print" class="btn" style="padding:10px 16px;font-size:12px;">Распечатать / PDF</button>
      </div>
    </div>
    <div class="card" id="detail-card"></div>
  </div>

</div>

<script src="config.js"></script>
<script>
(function() {
  'use strict';
  const $ = id => document.getElementById(id);
  const LS_AUTH = 'souschef_admin_auth';
  let currentResultId = null; // Храним ID текущей открытой записи

  if (sessionStorage.getItem(LS_AUTH) === '1') {
    $('screen-login').classList.add('hidden'); $('screen-list').classList.remove('hidden'); loadResults();
  }

  $('btn-login').onclick = () => {
    if ($('pwd').value === ADMIN_PASSWORD) {
      sessionStorage.setItem(LS_AUTH, '1');
      $('screen-login').classList.add('hidden'); $('screen-list').classList.remove('hidden'); loadResults();
    } else { $('login-error').classList.remove('hidden'); }
  };
  $('pwd').addEventListener('keydown', e => { if (e.key === 'Enter') $('btn-login').click(); });
  $('btn-logout').onclick = () => { sessionStorage.removeItem(LS_AUTH); location.reload(); };
  $('btn-refresh').onclick = () => loadResults();
  $('btn-back').onclick = () => { $('screen-detail').classList.add('hidden'); $('screen-list').classList.remove('hidden'); };
  $('btn-print').onclick = () => window.print();

  // Логика удаления
  $('btn-delete').onclick = async () => {
    if (!currentResultId) return;
    if (confirm('Ты уверен, что хочешь удалить этот результат? Это действие нельзя отменить.')) {
      try {
        const res = await fetch(DB_URL + '/results/' + currentResultId + '.json', { method: 'DELETE' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        // Успешно удалено
        $('screen-detail').classList.add('hidden');
        $('screen-list').classList.remove('hidden');
        loadResults(); // Обновляем список
      } catch (e) {
        alert('Ошибка при удалении: ' + e.message);
      }
    }
  };

  let allResults = [];

  async function loadResults() {
    const c = $('results-container');
    c.innerHTML = '<div class="empty">Загрузка…</div>';
    if (!DB_URL || DB_URL.indexOf('ТВОЙ-ПРОЕКТ') !== -1) { c.innerHTML = '<div class="empty">Firebase не настроен</div>'; return; }
    try {
      const res = await fetch(DB_URL + '/results.json');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      allResults = data ? Object.entries(data).map(([id, r]) => ({ id, ...r })) : [];
      allResults.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
      renderList();
    } catch (e) { c.innerHTML = '<div class="empty">Ошибка загрузки: ' + e.message + '</div>'; }
  }

  function fmtDate(iso) {
    if (!iso) return '—';
    const d = new Date(iso); const pad = n => (n < 10 ? '0' : '') + n;
    return pad(d.getDate()) + '.' + pad(d.getMonth()+1) + '.' + d.getFullYear() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function getScoreColor(percent) {
    return percent >= 80 ? 'green' : (percent >= 50 ? 'yellow' : 'red');
  }

  function renderList() {
    const c = $('results-container');
    if (!allResults.length) { c.innerHTML = '<div class="empty">Пока нет результатов</div>'; return; }
    c.innerHTML = '';
    allResults.forEach(r => {
      const pct = r.percent || 0; const colorClass = getScoreColor(pct);
      const row = document.createElement('div'); row.className = 'result-row';
      row.innerHTML = '<div><div class="result-name"></div><div class="result-meta"></div></div><div class="result-score ' + colorClass + '"></div><div style="color:var(--text-dim);font-size:20px;">›</div>';
      
      let nameStr = r.name || '—';
      if (r.position) nameStr += ' (' + r.position + ')';
      if (r.role === 'employee') nameStr += ' 👤';
      
      row.querySelector('.result-name').textContent = nameStr;
      row.querySelector('.result-meta').textContent = (r.modeLabel || r.mode) + ' · ' + fmtDate(r.date);
      row.querySelector('.result-score').textContent = pct + '%';
      row.onclick = () => showDetail(r);
      c.appendChild(row);
    });
  }

  function showDetail(r) {
    currentResultId = r.id; // Запоминаем ID для удаления
    $('screen-list').classList.add('hidden'); $('screen-detail').classList.remove('hidden');
    const card = $('detail-card'); card.innerHTML = '';
    const pct = r.percent || 0; const colorClass = getScoreColor(pct);

    const head = document.createElement('div'); head.className = 'detail-header';
    head.innerHTML = '<div><h1 style="margin-bottom:6px;"></h1><div class="detail-meta"></div></div><div style="text-align:right;"><div class="result-score ' + colorClass + '" style="font-size:48px;line-height:1;"></div><div style="font-size:12px;color:var(--text-dim);margin-top:4px;">Баллов: <span id="raw-score"></span></div></div>';
    
    let titleStr = r.name || '—';
    if (r.position) titleStr += ' — ' + r.position;
    if (r.role === 'employee') titleStr += ' (Сотрудник)';
    
    head.querySelector('h1').textContent = titleStr;
    head.querySelector('.detail-meta').textContent = (r.modeLabel || r.mode) + ' · ' + fmtDate(r.date);
    head.querySelector('.result-score').textContent = pct + '%';
    head.querySelector('#raw-score').textContent = (r.score || 0) + ' из ' + (r.max || 0);
    card.appendChild(head);

    const div = document.createElement('div'); div.style.cssText = 'height:1px;background:linear-gradient(90deg,transparent,var(--border-strong),transparent);margin:20px 0;'; card.appendChild(div);

    (r.answers || []).forEach((a, i) => {
      const qa = document.createElement('div'); qa.className = 'qa';
      const q = document.createElement('div'); q.className = 'qa-q'; q.innerHTML = '<span class="qa-score"></span>';
      q.appendChild(document.createTextNode((i+1) + '. ' + (a.question || '')));
      q.querySelector('.qa-score').textContent = (a.score || 0) + ' / ' + (a.maxScore || a.correct.length || 4);
      qa.appendChild(q);

      const selLabel = document.createElement('div'); selLabel.className = 'qa-label'; selLabel.textContent = 'Выбрал:'; qa.appendChild(selLabel);
      (a.selected || []).forEach(t => {
        const el = document.createElement('div'); el.className = 'qa-item ' + ((a.correct || []).indexOf(t) !== -1 ? 'ok' : 'miss');
        el.textContent = (a.correct || []).indexOf(t) !== -1 ? '✓ ' + t : '✗ ' + t; qa.appendChild(el);
      });
      if (!a.selected || !a.selected.length) {
        const el = document.createElement('div'); el.className = 'qa-item neutral'; el.textContent = '— ничего не выбрал'; qa.appendChild(el);
      }

      const missed = (a.correct || []).filter(t => (a.selected || []).indexOf(t) === -1);
      if (missed.length) {
        const ml = document.createElement('div'); ml.className = 'qa-label'; ml.textContent = 'Не выбрал правильные:'; qa.appendChild(ml);
        missed.forEach(t => { const el = document.createElement('div'); el.className = 'qa-item neutral'; el.textContent = '○ ' + t; qa.appendChild(el); });
      }
      card.appendChild(qa);
    });
  }
})();
</script>
</body>
</html>
